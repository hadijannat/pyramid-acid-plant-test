- id: E07
  status: fail
  basis: >-
    Contradicted: the patent does describe three steps with heat exchangers, but none of them can run as the
    hypothesis needs. Its claims were re-read at source (US 9,108,846): the first step burns hydrogen sulfide
    at 900 C or more, or oxidises it over a catalyst from 200 C; the second runs at 390 to 430 C, over a
    vanadium catalyst by the patent's description; the third cools the gas to 60 to 120 C. No step runs at
    ambient temperature without a catalyst, and the hypothesis supplies neither heat nor catalyst. The three
    steps are the whole route from hydrogen sulfide to acid, not three stages of making sulfur dioxide.
  sources:
    - research/03-chemistry.md C2 and section 2c
    - research/03-chemistry.md Verification pass, check V14
  verified: true

