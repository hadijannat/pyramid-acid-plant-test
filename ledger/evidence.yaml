- id: E27
  status: fail
  basis: >-
    Contradicted: the example the criterion names, no sodium chloride in the wetted zone, is the opposite of
    what was read, and nothing else that the acid model predicts and the salt model cannot has been found.
    Sodium chloride is present in the Queen's Chamber, which the hypothesis fills: the 1978 letter lists some
    halite, and a laboratory study of 2026, read by two routes, identifies the efflorescence there as halite.
    The same study has efflorescence on the west wall and ceiling growing visibly between 2022 and 2024 (read by
    one extraction route only), which shows a present-day process, and the chamber was cleaned in 1995 to 1997
    without surviving documentation, so today's surface need not match the crust before the cleaning. The 1978
    letter is older than that cleaning; who took its sample, when and from what height is not stated. The test,
    as the criterion words it, is of the surface as sampled. No height-resolved salt map exists. The research
    file calls the inference from missing calcium chloride weak, since calcium chloride takes up water from the
    air and would not last as a crust (general knowledge there, not sourced).
  sources:
    - research/06-evidence-archaeology.md, "What pass/fail would look like", item 4
    - research/06-evidence-archaeology.md claim 2, verification notes of 2026-10-10 and revised verdict
    - research/06-evidence-archaeology.md claim 1, verification note of 2026-10-10
    - research/06-evidence-archaeology.md Verification pass, checks 1, 4 and 22
    - research/03-chemistry.md C9
  verified: true

- id: E28
  status: conditional
  basis: >-
    Partly supported: a salt crust on the Grand Gallery walls is documented for the 1990s, when twelve months
    were spent cleaning it off in 1998, but its composition was never published, an account of 1910 records no
    salt in the Gallery, and Petrie does not describe its walls. A crust limit at one level in the Queen's
    Chamber and the Gallery, which the criterion asks for, has not been looked for: no height-resolved salt map
    exists. The one height-resolved datum, Petrie's note that the two lower laps of the Queen's Chamber niche
    were salted and the three upper ones not, is not what a complete fill predicts, and the study of 2026 found
    no gypsum crust in that chamber.
  sources:
    - research/06-evidence-archaeology.md claim 3
    - research/06-evidence-archaeology.md, "What pass/fail would look like", item 1
    - research/06-evidence-archaeology.md Verification pass, checks 4, 8, 9, 10 and 22
  verified: true

- id: E30
  status: conditional
  basis: >-
    No evidence found: no published description or survey of pitting in the Queen's Chamber was found. Petrie
    and the Edgars describe salt incrustation and fine joints there, not pits, and the pits are the speaker's
