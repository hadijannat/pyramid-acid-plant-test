# Evidence register. One entry per claim that a document, not a computation, decides. Authored by hand.
# Keys: id; status; basis; sources; verified. pyramid/evidence.py loads this file.
#
# status follows the ruling in docs/superpowers/specs/2026-10-11-simulations-design.md section 2:
#   pass          the criterion's condition is met by a source the research files read
#   fail          a source that would show it was read and does not, or contradicts it
#   conditional   it is partly met, or rests on a secondary source or on a measurement nobody has made
#   undefined     the claim names no source that could be checked, or the hypothesis leaves the matter unspecified
#   not_testable  the claim's own criterion says no computation or document can decide it
# The criterion in ledger/claims.yaml is applied as written. Where its words and the research file's headline
# standing part, the criterion sets the status and the standing still opens the basis.
#
# basis opens with the research file's own standing ("Supported:", "No evidence found:", "Contradicted:",
# "Partly supported:", "Not specified by the hypothesis:", "No test exists:") and states what was read, so that
# an absence is never reported as a contradiction. It asserts only what the research files state, and says so
# where they read a source at second hand, as an abstract or as OCR text.
# sources are sections of the research files. verified is true when the research files read at source the
# document the status rests on, and false when it rests on a secondary page, on a search that found nothing or
# on no source at all.

# --- Undefined by the criterion's own words ---

