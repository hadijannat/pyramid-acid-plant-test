    retreat, gypsum crust or tool marks was found, which is what the criterion asks for. Khufu's two southern
    pits were found sealed over dismantled boats, on secondary accounts.
  sources:
    - research/07-plateau-geology.md C11, second-pass note, and section 4.3
    - research/07-plateau-geology.md Verification pass, check 9
