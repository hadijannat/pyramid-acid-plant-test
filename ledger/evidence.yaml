- id: E35
  status: conditional
  basis: >-
    Partly supported: the cited article does say both things, but neither condition of the criterion is met in
    full. The article, read in full, calls the features veins of vitrification, grants that iron-rich
    hydrothermal deposits may occur as well, and reports no sampling and no analysis, so there are no laboratory
    data for vitrified vein material; nobody has published that analysis. The lightning is in the Inventory
    Stela, an object of the 26th Dynasty: the translations attributed to Maspero and to Daressy have one great
    tree struck at the Place of the Sycamore, in an abraded passage whose reading is doubted, and Breasted's
    partial translation has no lightning at all. All three were seen as quoted on secondary pages, not in a
    primary edition. The passage records one strike, not how often lightning struck.
  sources:
    - research/06-evidence-archaeology.md claim 13 and Verification pass, check 13
    - research/07-plateau-geology.md C7, C8 and C9 with their second-pass notes
    - research/07-plateau-geology.md Verification pass, checks 4, 5 and 6
  verified: false

- id: E36
  status: fail
  basis: >-
    No evidence found: the sample analyses were located and read in full, and they do not report what the
    claim says. The report, by an independent group and not peer-reviewed, covers 16 samples of iron-stained
    material from four of Khafre's boat pits and one control sample, not veins across the plateau, and it has no
    word for fulgurite, glass or sphere. Lanthanum, cerium and neodymium exceed the control in 3, 4 and 5 of
    the 16 samples, with medians about half the control, and thorium is below it in all 16; nickel, cobalt,
    vanadium, zinc and uranium are above it, as is usual for iron and manganese oxide fills. No fulgurite,
    vitrified rock or microspherule from Giza is documented in any source found.
  sources:
    - research/07-plateau-geology.md C6 and C7 with their second-pass notes
    - research/07-plateau-geology.md Verification pass, checks 4, 7 and 8, and the first item of the evidence in favour
  verified: true

- id: E37
  status: conditional
  basis: >-
    No evidence found: no four-point measurement along a Giza vein has been made, so the test the criterion
    names cannot be applied. Measured dry hematite spans the whole range: earthy red material is more resistive
    than the limestone, and the best specular sample gives a contrast of about 3e4 in 100 ohm m rock, above the
    criterion's fail line of 1e3 and below the 2.7e5 derived for a 100 m link. Observers describe the Giza fills
    as red, ochreous or dull black, the resistive end. Veins in the Osiris Shaft are reported from personal
    observation, and those in the two pyramids rest on the speaker's photographs. The research file expects a
    fail and says a measurement is needed.
  sources:
    - research/07-plateau-geology.md section 4.2 with its second-pass notes
    - research/07-plateau-geology.md C8 and C11 with their second-pass notes
    - research/07-plateau-geology.md Verification pass, check 10 and the verdict changes
    - research/00-hypothesis.md E37
  verified: false

- id: E39
  status: conditional
  basis: >-
    Partly supported: chloride in Khafre's pits is supported, exclusivity is not, and the test the criterion
    names has not been made. The analyses behind the claim, an independent group's report that is not
    peer-reviewed and was read in full, cover Khafre's pits only: chlorine reaches 26.7 percent by weight, with
    gypsum named in almost every phase description, barite and celestine imaged and sulfur up to 5 percent, so
