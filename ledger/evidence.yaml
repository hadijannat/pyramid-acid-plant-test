# --- Documentary checks ---

- id: E02
  status: fail
  basis: >-
    No evidence found: no match between the two datasets was found. Both were read in full; the research file
    calls the claim weak and does not call it contradicted. The cited paper analysed one sulfate nodule and one
    host mudstone by X-ray fluorescence; of the ten elements the speaker names for the iron deposits it reports
    four, all common trace elements, and none of cerium, neodymium, silver, gold, platinum or tin. The
    iron-deposit data are 16 samples from Khafre's boat pits, in a report that is not peer-reviewed. The one
    level the files give for both, thorium, is 139 ppm in the paper's nodule and 0.25 to 1.36 ppm in the pit
    samples.
  sources:
    - research/07-plateau-geology.md C6, second-pass note
    - research/07-plateau-geology.md Verification pass, checks 1, 7 and 8, the derived values, the last open item
  verified: true

- id: E03
  status: fail
  basis: >-
    No evidence found: no survey of a Giza cave shows cave forms cut in iron ore. The one study of Giza cave
    deposits that was read in full describes a mudstone exposure on the west side of the plateau and reports
    iron and manganese oxide as a minor part of gypsum and fracture fills (0.65 and 6.19 percent iron oxide by
    weight in its two samples), and the research file finds no ore body documented at Giza: the plateau is
    carbonate rock with minor oxide fills. That exposure is not the Tomb of the Birds; the research files read no
    survey of that cave and record no search for one. The paper the claim cites concerns iron-ore caves at other
    sites, which the criterion sets aside, and no research file opened it.
  sources:
    - research/07-plateau-geology.md C1 with its second-pass note, and C10
    - research/07-plateau-geology.md Verification pass, check 1
    - research/00-hypothesis.md E03
  verified: true

- id: E04
  status: conditional
  basis: >-
    Partly supported: mineral evidence of sulfuric-acid cave formation is published for the plateau, but not
    for the sites named. One paper, read in full, argues it from natroalunite, replacive gypsum and related
    minerals at a single exposure at Darb El Fayum on the west side, in a mudstone unit it lists apart from the
    formation the pyramids stand on. That exposure is not the trial passages, the Tomb of the Birds or any cave
    the speaker names, and no sulfur isotopes were measured. Likeness in photographs is not evidence.
  sources:
    - research/07-plateau-geology.md C1 with its second-pass note
    - research/07-plateau-geology.md Verification pass, checks 1 and 2
  verified: true

